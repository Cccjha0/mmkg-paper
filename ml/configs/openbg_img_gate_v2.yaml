# OpenBG-IMG availability-aware vector Gate v2 with learned missing-state embeddings.
dataset:
  name: openbg_img
  train: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_train.tsv
  dev: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_dev.tsv
  test: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_test.tsv
  cache_dir: data/cache/openbg_img
  cache_format: auto

protocol:
  version: openbg_legacy_v1
  split: paper_split
  modality_policy: explicit_independent_availability
  evaluation: filtered_bidirectional

model:
  name: openbg_img_gate_v2
  num_relations: 136
  use_layernorm: true

training:
  termination_policy: dev_early_stop
  lr: 0.001
  text_dropout: 0.0
  img_dropout: 0.1
  gate_reg_weight: 0.001
  gate_reg_target: 0.5
  epochs: 300
  eval_every: 5
  early_stop_patience: 10

evaluation:
  dev_eval_limit: 5000
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: openbg_img_gate_v2_state
