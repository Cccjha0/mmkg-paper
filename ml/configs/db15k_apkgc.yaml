# General-protocol config. Hyperparameters are starting anchors; tune on validation only.
dataset:
  name: db15k
  loader: openke_mmkg
  processed_dir: data/datasets/db15k/processed

protocol:
  version: mmkg_general_v1
  split: db15k_train_holdout_v1
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional

model:
  name: mmkg_apkgc
  num_relations: 279
  dim: 128
  margin: 12.0
  epsilon: 2.0
  num_hidden_layers: 1
  num_attention_heads: 2
  joint_way: Mformer_hd_graph
  num_proj: 2
  add_noise: true
  noise_update: epoch
  noise_ratio: 0.2
  mask_ratio: 0.7
  attention_dropout: 0.1
  use_intermediate: false
training:
  termination_policy: dev_early_stop
  sampler: bernoulli_filtered
  lr: 0.0001
  batch_size: 1024
  neg_ratio: 32
  epochs: 8000
  eval_every: 5
  early_stop_patience: 10
evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: db15k_apkgc
