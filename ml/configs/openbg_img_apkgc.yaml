# APKGC official-default starting point; all tuning remains DEV ONLY.
dataset:
  name: openbg_img
  train: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_train.tsv
  dev: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_dev.tsv
  test: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_test.tsv
  cache_dir: data/cache/openbg_img
  cache_format: raw

model:
  name: openbg_img_apkgc
  num_relations: 136
  dim: 128
  margin: 6.0
  epsilon: 2.0
  num_hidden_layers: 1
  num_attention_heads: 1
  joint_way: Mformer_hd_mean
  num_proj: 1
  # The supplied upstream runner enables APKGC noise and uses these values.
  # Any alternative is a separately declared DEV-only configuration.
  add_noise: true
  noise_update: epoch
  noise_ratio: 0.2
  mask_ratio: 0.7
  attention_dropout: 0.1
  use_intermediate: false

training:
  engine: standard
  sampler: bernoulli_filtered
  lr: 0.001
  batch_size: 512
  neg_ratio: 1
  adv_temperature: 2.0
  epochs: 1000
  early_stop_patience: 10

evaluation:
  chunk_size: 4096
  query_batch_size: 32

output:
  exp_name: openbg_img_apkgc
