# Structural shared-protocol anchor.
dataset:
  name: db15k
  loader: openke_mmkg
  processed_dir: data/datasets/db15k/processed
protocol:
  version: mmkg_general_v1
  split: db15k_train_holdout_v1
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional
model:
  name: mmkg_complex
  num_relations: 279
training:
  termination_policy: dev_early_stop
  lr: 0.001
  epochs: 200
  eval_every: 5
  early_stop_patience: 10
evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false
output:
  exp_name: db15k_complex
