# =========================
# Experiment Config: OpenBG-IMG Full Model + Weaker Residual Init
# =========================

dataset:
  name: openbg_img
  train: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_train.tsv
  dev: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_dev.tsv
  test: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_test.tsv
  cache_dir: data/cache/openbg_img
  cache_format: auto

model:
  name: openbg_img_gate_residual
  num_relations: 136
  use_layernorm: true
  use_normalized_mix: true

training:
  lr: 0.0004
  adv_temperature: 2.0
  img_dropout: 0.2
  gate_reg_weight: 0.001
  gate_reg_target: 0.3
  early_stop_patience: 15
  fusion_warmup_epochs: 0
  residual_warmup_epochs: 0
  residual_scale_init: -4.0

evaluation:
  chunk_size: 4096
  query_batch_size: 32

output:
  exp_name: openbg_img_gated_vec_res_rel_weakres

inference:
  attribute_relations: [rel_0031, rel_0092, rel_0086, rel_0096, rel_0043]
