# =========================
# Experiment Config: OpenBG-IMG Residual-Only (no fusion)
# =========================

dataset:
  name: openbg_img
  train: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_train.tsv
  dev: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_dev.tsv
  test: data/datasets/openbg_img/paper_split/OpenBG-IMG_paper_test.tsv
  cache_dir: data/cache/openbg_img
  cache_format: auto

model:
  name: openbg_img_residual_only
  num_relations: 136
  use_layernorm: true

training:
  lr: 0.0001
  img_dropout: 0.1

evaluation:
  chunk_size: 4096
  query_batch_size: 32

output:
  exp_name: openbg_img_residual_only
