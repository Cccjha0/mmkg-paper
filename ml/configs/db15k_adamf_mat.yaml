# General-protocol config. Hyperparameters are starting anchors; tune on validation only.
dataset:
  name: db15k
  loader: openke_mmkg
  processed_dir: data/datasets/db15k/processed

protocol:
  version: mmkg_general_v1
  split: db15k_train_holdout_v1
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional

model:
  name: mmkg_adamf_mat
  num_relations: 279
  dim: 250
  margin: 12.0
  epsilon: 2.0
training:
  termination_policy: dev_early_stop
  engine: adversarial
  sampler: bernoulli_filtered
  batch_size: 1024
  neg_ratio: 128
  lr: 0.00002
  generator_lr: 0.0001
  mu: 0.0
  generator_noise_dim: 64
  generator_hidden_dim: 512
  epochs: 1000
  eval_every: 5
  early_stop_patience: 10
evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: db15k_adamf_mat
