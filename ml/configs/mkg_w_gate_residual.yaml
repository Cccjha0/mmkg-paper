# General-protocol config. Hyperparameters are starting anchors; tune on validation only.
dataset:
  name: mkg_w
  loader: openke_mmkg
  processed_dir: data/datasets/mkg_w/processed

protocol:
  version: mmkg_general_v1
  split: official
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional

model:
  name: mmkg_gate_residual
  num_relations: 169
  use_layernorm: true
  use_normalized_mix: true
training:
  termination_policy: dev_early_stop
  lr: 0.0004
  img_dropout: 0.2
  gate_reg_weight: 0.001
  gate_reg_target: 0.3
  early_stop_patience: 15
  epochs: 200
  eval_every: 5
evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: mkg_w_gate_residual
