# Generalized-v2 DEV-only anchor. Tune all non-frozen values on validation only.
dataset:
  name: mkg_w
  loader: openke_mmkg
  processed_dir: data/datasets/mkg_w/processed

protocol:
  version: mmkg_general_v1
  split: official
  modality_policy: structure_only
  evaluation: filtered_bidirectional

model:
  name: mmkg_structural_v2
  num_relations: 169

training:
  termination_policy: dev_early_stop
  # Match the converged structural anchors' optimization scale.  softplus(0.5413)
  # is approximately 1, avoiding the severely attenuated scores produced by
  # the previous -2 initialization while retaining the explicit v2 parameter.
  lr: 0.001
  entity_l2_weight: 0.000001
  structural_scale_init: 0.5413
  structural_scale_l2_weight: 0.0
  epochs: 300
  eval_every: 5
  early_stop_patience: 10

evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: mkg_w_structural_v2
