# General-protocol config. Hyperparameters are starting anchors; tune on validation only.
dataset:
  name: db15k
  loader: openke_mmkg
  processed_dir: data/datasets/db15k/processed

protocol:
  version: mmkg_general_v1
  split: official
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional

model:
  name: mmkg_native
  num_relations: 279
  dim: 250
  margin: 12.0
  epsilon: 2.0
training:
  engine: adversarial_gp
  sampler: bernoulli_filtered
  batch_size: 1024
  neg_ratio: 128
  lr: 0.0001
  generator_lr: 0.0001
  mu: 0.0001
  regularization_weight: 0.00001
  gradient_penalty_coefficient: 0.1
  generator_noise_dim: 64
  generator_hidden_dim: 512
  epochs: 1000
evaluation:
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: db15k_native
