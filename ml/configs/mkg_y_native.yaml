# General-protocol MKG-Y anchor from the released NativE script. DEV only.
dataset:
  name: mkg_y
  loader: openke_mmkg
  processed_dir: data/datasets/mkg_y/processed

protocol:
  version: mmkg_general_v1
  split: official
  modality_policy: native_text_visual_availability
  evaluation: filtered_bidirectional

model:
  name: mmkg_native
  num_relations: 28
  dim: 250
  margin: 4.0
  epsilon: 2.0
training:
  termination_policy: dev_early_stop
  engine: adversarial_gp
  sampler: bernoulli_filtered
  batch_size: 1024
  neg_ratio: 128
  lr: 0.0001
  generator_lr: 0.0001
  mu: 0.0001
  regularization_weight: 0.00001
  gradient_penalty_coefficient: 0.1
  generator_noise_dim: 64
  generator_hidden_dim: 512
  epochs: 1000
  eval_every: 5
  early_stop_patience: 10
evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: mkg_y_native
