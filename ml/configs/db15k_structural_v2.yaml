# Generalized-v2 DEV-only anchor. Tune all non-frozen values on validation only.
dataset:
  name: db15k
  loader: openke_mmkg
  processed_dir: data/datasets/db15k/processed

protocol:
  version: mmkg_general_v1
  split: db15k_train_holdout_v1
  modality_policy: structure_only
  evaluation: filtered_bidirectional

model:
  name: mmkg_structural_v2
  num_relations: 279

training:
  termination_policy: dev_early_stop
  lr: 0.0001
  entity_l2_weight: 0.000001
  structural_scale_init: -2.0
  structural_scale_l2_weight: 0.0001
  epochs: 200
  eval_every: 5
  early_stop_patience: 10

evaluation:
  dev_eval_limit: null
  filtered: true
  direction: both
  chunk_size: 4096
  query_batch_size: 32
  run_test: false

output:
  exp_name: db15k_structural_v2
